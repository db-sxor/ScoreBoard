{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block body %}
<main class="login-wrap">
  <form class="login-card" method="post">
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="alert">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <input id="password" name="password" type="password" placeholder="비밀번호" aria-label="관리자 비밀번호" required autofocus>
    <button class="primary-btn full-btn" type="submit">로그인</button>
  </form>
</main>
{% endblock %}
