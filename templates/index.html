{% extends "base.html" %}
{% block title %}점수판{% endblock %}

<main class="page-shell">

    <h1></h1>
  </header>

  <section id="team-list" class="team-grid" aria-live="polite">
    <div class="loading-card">점수를 불러오는 중입니다.</div>
